<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>YoSoyTaku</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="YoSoyTaku — hub de redes sociales" />

    <!-- Font Awesome y font -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link rel="icon" href="img/tp.ico" type="image/x-icon" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>
    <div class="janedoe" aria-hidden="true">
      <img src="img/janedoe.png" alt="Jane Doe" />
    </div>
    <div class="janedoe2" aria-hidden="true">
      <img src="img/janedoe2.png" alt="Jane Doe" />
    </div>
    <main class="window" id="mainContent">
      <!-- Barra de dirección: sensación de "página web" -->
      <div class="titlebar" aria-hidden="true">
        <span class="urlbar"
          ><i class="fas fa-lock"></i>yosoytaku.github.io</span
        >
      </div>

      <div class="content">
        <div class="profile">
          <span
            class="retro-avatar-frame"
            style="--avatar-size: 140px; --avatar-border-color: #d10028"
          >
            <img
              src="img/Takupfp.webp"
              alt="YoSoyTaku"
              class="retro-avatar no-hover"
            />
          </span>
          <div class="profile-text">
            <h1>YoSoyTaku</h1>
            <p class="bio">
              <span class="bio-text">Casado mentalmente con Jane Doe ❤️🐭</span>
            </p>
          </div>
        </div>

        <div class="links">
          <a
            href="https://discord.gg/JyEypq93Nc"
            class="button discord"
            target="_blank"
            rel="noopener noreferrer"
          >
            <i class="fab fa-discord icon" aria-hidden="true"></i>
            <span class="label">Discord</span>
            <i class="fas fa-arrow-right go" aria-hidden="true"></i>
          </a>

          <a
            href="https://www.tiktok.com/@yosoytaku_"
            class="button tiktok"
            target="_blank"
            rel="noopener noreferrer"
          >
            <i class="fab fa-tiktok icon" aria-hidden="true"></i>
            <span class="label">TikTok</span>
            <i class="fas fa-arrow-right go" aria-hidden="true"></i>
          </a>

          <a
            href="https://www.kick.com/yosoytaku"
            class="button kick"
            target="_blank"
            rel="noopener noreferrer"
          >
            <i class="fab fa-kickstarter icon" aria-hidden="true"></i>
            <span class="label">Kick</span>
            <i class="fas fa-arrow-right go" aria-hidden="true"></i>
          </a>

          <a
            href="https://www.instagram.com/takudumb/"
            class="button instagram"
            target="_blank"
            rel="noopener noreferrer"
          >
            <i class="fab fa-instagram icon" aria-hidden="true"></i>
            <span class="label">Instagram</span>
            <i class="fas fa-arrow-right go" aria-hidden="true"></i>
          </a>

          <a
            href="https://www.youtube.com/@YoSoyTaku"
            class="button youtube"
            target="_blank"
            rel="noopener noreferrer"
          >
            <i class="fab fa-youtube icon" aria-hidden="true"></i>
            <span class="label">YoSoyTaku</span>
            <i class="fas fa-arrow-right go" aria-hidden="true"></i>
          </a>

          <a
            href="https://www.youtube.com/@TakuClip"
            class="button youtube"
            target="_blank"
            rel="noopener noreferrer"
          >
            <i class="fab fa-youtube icon" aria-hidden="true"></i>
            <span class="label">TakuClip</span>
            <i class="fas fa-arrow-right go" aria-hidden="true"></i>
          </a>
        </div>

        <footer class="credits">
          <p>
            Mejorado con <i class="fas fa-heart" aria-hidden="true"></i> por
            <a
              href="https://github.com/modalesxd"
              target="_blank"
              rel="noopener noreferrer"
              >modalesxd</a
            >
          </p>
        </footer>
      </div>
    </main>
  </body>
</html>
